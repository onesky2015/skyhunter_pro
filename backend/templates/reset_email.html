<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyHunter 验证码</title>
</head>
<body style="margin:0;padding:0;background-color:#000000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#000000;padding:20px 0;">
<tr><td align="center">
<table width="600" cellpadding="0" cellspacing="0" style="background-color:#111111;border-radius:12px;border:1px solid #333333;overflow:hidden;">
  <!-- Header -->
  <tr>
    <td style="padding:24px 32px;text-align:center;border-bottom:1px solid #222222;">
      <h1 style="margin:0;color:#00FF00;font-size:24px;font-weight:700;">SkyHunter</h1>
    </td>
  </tr>
  <!-- Content -->
  <tr>
    <td style="padding:32px;">
      <h2 style="margin:0 0 12px;color:#FFFFFF;font-size:20px;text-align:center;">{{title}}</h2>
      <p style="margin:0 0 24px;color:#999999;font-size:14px;text-align:center;line-height:1.6;">
        {{description}}
      </p>
      <!-- Code -->
      <div style="text-align:center;margin:0 0 24px;">
        <div style="display:inline-block;background-color:#1a1a1a;border:2px solid #00FF00;border-radius:12px;padding:16px 40px;">
          <span style="color:#00FF00;font-size:36px;font-weight:700;letter-spacing:8px;font-family:monospace;">{{code}}</span>
        </div>
      </div>
      <p style="margin:0;color:#666666;font-size:12px;text-align:center;">
        验证码有效期 15 分钟，请勿泄露给他人。<br>
        This code expires in 15 minutes. Do not share it.
      </p>
    </td>
  </tr>
  <!-- Footer -->
  <tr>
    <td style="padding:20px 32px;border-top:1px solid #222222;text-align:center;">
      <p style="margin:0;color:#666666;font-size:11px;">如果您没有请求此操作，请忽略此邮件。</p>
      <p style="margin:4px 0 0;color:#666666;font-size:11px;">If you did not request this, please ignore this email.</p>
    </td>
  </tr>
</table>
</td></tr>
</table>
</body>
</html>
